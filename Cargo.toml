[workspace]
resolver = "3"
members = [
    "core",
    "renderer",
    "processing-lite",
    "gallery",
    "app",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tsubu-core = { path = "core" }
tsubu-renderer = { path = "renderer" }
tsubu-processing-lite = { path = "processing-lite" }
tsubu-gallery = { path = "gallery" }

wgpu = "30.0"
# つぶやき GLSL を WGSL へ翻訳する。wgpu が内部で使っているものと同じ版。
# glsl-in だけでは足りない (naga 30.0.0 の内部モジュールが wgsl-in に依存している)。
naga = { version = "30.0", features = ["glsl-in", "wgsl-in", "wgsl-out"] }
winit = "0.30"
# 起動できなかったことを OS のダイアログで伝えるためだけに使う。winit が
# 既に同じ版を引いているので、依存は増えない。
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# exe へアイコンと版情報を埋める。ビルド時にしか使わない。
winresource = "0.1"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
# フォントの字形取り出し。egui も同じものを使っているので依存は増えない。
skrifa = "0.44"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.dev]
opt-level = 1

# Dependencies of the renderer are unusably slow in a debug build; the sketch
# runtime is only meaningful at 60fps, so optimise them even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
